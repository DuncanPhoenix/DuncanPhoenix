<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Duncan Phoenix | Official Artist Site</title>
    <style>
        :root {
            --primary-red: #cc0000;
            --dark-bg: #0a0a0a;
            --sidebar-bg: #111;
            --text-light: #f4f4f4;
            --accent-gray: #222;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: black;
            color: var(--text-light);
            margin: 0;
            display: flex; /* Sidebar layout */
        }
      
        /* Side Menu Panel */
		.bg-img {
  /* The image used */
  background-image: url("images/fstripev.png" );	
  
  min-height: 380px;

  /* Center and scale the image nicely */
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;

  /* Needed to position the navbar */
  position: relative;
}

/* Position the navbar container inside the image */
.container {
  position: absolute;
  margin: 20px;
  width: auto;
}

/* The navbar */

        nav.sidebar {
            width: 220px;
            height: 100vh;
            background: var(black);
            position: fixed;
            border-right: 2px solid var(--primary-red);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-red);
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .nav-links { list-style: none; padding: 0; }
        .nav-links li { margin: 20px 0; }
        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--primary-red); }

        /* Main Content Area */
        main {
            margin-left: 290px; /* Offset for fixed sidebar */
            flex-grow: 1;
            padding: 0 20px 40px 0;
        }

        header {
            height: 10vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), 
                        url('');
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .section-container { max-width: 800px; margin: 40px auto; }
        .track-list { background: #191970; padding: 20px; border-radius: 8px; opacity: 0.6; }
        .track-item { display: flex; padding: 10px; border-bottom: 1px solid #333; }
        .track-number { width: 30px; color: var(#6495ED); }
        
        /* Placeholder for new topics */
        .content-block { padding: 40px 0; border-top: 1px solid #333; }
         h2 { border-left: 4px solid var(--primary-red); padding-left: 15px; text-transform: uppercase; }
		
		.foot { position: absolute; bottom: 0; height: 240px; background: black; width: inherit; }
    </style>
</head>
